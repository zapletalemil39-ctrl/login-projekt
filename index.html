<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #0f1115, #050607);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.container {
  background: #1c1f26;
  padding: 35px;
  border-radius: 12px;
  width: 320px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

h2 {
  margin-bottom: 25px;
  text-align: center;
}

input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: none;
  border-radius: 8px;
  background: #2a2d35;
  color: white;
  font-size: 14px;
}

input:focus {
  outline: 2px solid #5865f2;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #5865f2;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #4752c4;
}

.secondary {
  background: #2a2d35;
}

.secondary:hover {
  background: #3a3d45;
}

#msg {
  margin-top: 15px;
  font-size: 13px;
  color: #aaa;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">
  <h2>Anmelden</h2>

  <input id="user" placeholder="Benutzername / E-Mail">
  <input id="pass" type="password" placeholder="Passwort">

  <button onclick="login()">Anmelden</button>
  <button class="secondary" onclick="register()">Registrieren</button>

  <p id="msg"></p>
</div>

<script>
async function register() {
  const res = await fetch("/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  msg.innerText = await res.text();
}

async function login() {
  const res = await fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  msg.innerText = await res.text();
}
</script>

</body>
</html>
