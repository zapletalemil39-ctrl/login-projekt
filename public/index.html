<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1115;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.box {
  background: #1c1f26;
  padding: 30px;
  border-radius: 12px;
  width: 300px;
  text-align: center;
}

h2 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: none;
  border-radius: 6px;
  background: #2a2d35;
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  background: #5865f2;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #4752c4;
}

.forgot {
  background: transparent;
  color: #aaa;
  margin-top: 10px;
  font-size: 13px;
}

.forgot:hover {
  color: white;
}

#msg {
  margin-top: 15px;
  color: red;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="box">
  <h2>Bei Roblox anmelden</h2>

  <input id="user" placeholder="E-Mail / Benutzername">
  <input id="pass" type="password" placeholder="Passwort">

  <button onclick="fakeLogin()">Anmelden</button>
  <button onclick="fakeLogin()">Registrieren</button>

  <button class="forgot" onclick="forgot()">
    Passwort vergessen?
  </button>

  <p id="msg"></p>
</div>

<script>
function fakeLogin() {
  document.getElementById("msg").innerText =
    "Benutzername oder Passwort ist falsch";
}

function forgot() {
  window.location.href = "https://www.roblox.com/de/login/forgot-password-or-username";
}
</script>

</body>
</html>
