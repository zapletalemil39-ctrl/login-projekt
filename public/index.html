<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #12141c;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: #fff;
}

.container {
  width: 360px;
}

h2 {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 20px;
}

.input {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid #3a3d45;
  background: #2a2d35;
  color: white;
  font-size: 14px;
}

.input::placeholder {
  color: #aaa;
}

.login-btn {
  width: 100%;
  padding: 14px;
  border: 1px solid #3a3d45;
  background: transparent;
  color: white;
  cursor: pointer;
  margin-bottom: 15px;
}

.login-btn:hover {
  background: #2a2d35;
}

.link {
  text-align: center;
  font-size: 14px;
  margin-bottom: 20px;
  cursor: pointer;
}

.divider {
  height: 1px;
  background: #3a3d45;
  margin: 20px 0;
}

.secondary-btn {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  background: #2a2d35;
  border: none;
  color: white;
  cursor: pointer;
}

.secondary-btn:hover {
  background: #3a3d45;
}

.register {
  text-align: center;
  font-size: 14px;
  margin-top: 20px;
}

.register span {
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h2>Bei Roblox anmelden</h2>

  <input class="input" placeholder="Benutzer/E-Mail/Telefon">
  <input class="input" type="password" placeholder="Passwort">

  <button class="login-btn">Anmelden</button>

  <div class="link">Passwort oder Benutzername vergessen?</div>

  <div class="divider"></div>

  <button class="secondary-btn">Einmaligen Code per E-Mail senden</button>
  <button class="secondary-btn">Schnellanmeldung</button>

  <div class="register">
    Du hast kein Konto? <span>Registrieren</span>
  </div>
</div>

</body>
</html>
